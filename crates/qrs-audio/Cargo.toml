[package]
name = "qrs-audio"
description = "quickRS audio engine: devices, real-time graph, tones, decoding, stretching, synth"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# ASIO through cpal (needs LIBCLANG_PATH; the ASIO SDK is downloaded by the build)
asio = ["cpal/asio"]
# the real units' names in brackets beside the soundalike models (the owner's build only, D42, D58)
brands = []

[dependencies]
cpal.workspace = true
qrs-formats.workspace = true
qrs-analysis.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
lewton.workspace = true
symphonia.workspace = true
rubato.workspace = true
rtrb.workspace = true
signalsmith-stretch.workspace = true
crossbeam-channel.workspace = true
realfft.workspace = true
parking_lot.workspace = true

# Linux: PulseAudio / PipeWire (through pipewire-pulse) before ALSA: every input and output by its own name, shared
# with other programs, so the guitar interface and the laptop's speakers can be used at once (pure Rust, no libpulse)
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["pulseaudio"] }

[target.'cfg(windows)'.dependencies]
windows-core.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_Devices_DeviceAndDriverInstallation",
] }

[dev-dependencies]
serde_json.workspace = true
qrs-formats = { workspace = true }
