[package]
name = "qrs-cli"
description = "quickRS command line"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# the `lessons check` command (off by default with the app's Lessons page, D152)
lessons = []
# the pedalboard's real brand names (off in the shared build, D58)
brands = ["qrs-audio/brands"]

[dependencies]
qrs-formats.workspace = true
qrs-analysis.workspace = true
qrs-audio.workspace = true
qrs-library.workspace = true
anyhow.workspace = true
clap.workspace = true
rtrb.workspace = true
serde.workspace = true
serde_json.workspace = true
realfft.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
qrs-audio = { workspace = true, features = ["asio"] }

[[bin]]
name = "quickrs-cli"
path = "src/main.rs"
