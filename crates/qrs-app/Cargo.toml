[package]
name = "qrs-app"
description = "quickRS desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true


[dependencies]
qrs-formats.workspace = true
qrs-analysis.workspace = true
qrs-audio.workspace = true
qrs-library.workspace = true
qrs-ui.workspace = true
anyhow.workspace = true
eframe.workspace = true
image.workspace = true
raw-window-handle.workspace = true
chrono.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# ASIO drivers (RS_ASIO-style setups, audio interfaces' own drivers)
qrs-audio = { workspace = true, features = ["asio"] }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[[bin]]
name = "quickrs"
path = "src/main.rs"
