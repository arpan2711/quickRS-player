[package]
name = "qrs-app"
description = "quickRS desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# the Lessons page and the coach: off in every build for now (D152, the owner put Lessons aside; was the owner's
# build only, D50). `--features lessons` builds them back in
lessons = []
# NAM captures and TONE3000 on the pedalboard (P31, D80: the owner's build only for now)
nam = []
# the pedalboard's real brand names (off in the shared build, D58)
brands = ["qrs-audio/brands"]

[dependencies]
qrs-formats.workspace = true
qrs-analysis.workspace = true
qrs-audio.workspace = true
qrs-library.workspace = true
qrs-ui.workspace = true
anyhow.workspace = true
eframe.workspace = true
image.workspace = true
raw-window-handle.workspace = true
chrono.workspace = true
tiny-skia.workspace = true
serde.workspace = true
serde_json.workspace = true
# the folder and keys-file pickers (Settings > Library, the welcome)
rfd = { version = "0.15", default-features = false }
ureq.workspace = true
sha2.workspace = true
getrandom.workspace = true
zip.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Linux: the desktop's own file picker, through its xdg portal (GNOME, KDE, ...); no GTK to build against (P28.1)
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[target.'cfg(windows)'.dependencies]
# ASIO drivers (RS_ASIO-style setups, audio interfaces' own drivers)
qrs-audio = { workspace = true, features = ["asio"] }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[[bin]]
name = "quickrs"
path = "src/main.rs"
