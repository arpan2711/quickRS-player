[package]
name = "qrs-convert"
description = "quickRS Converter: a window that converts a folder of .psarc songs to feedpaks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "quickrs-convert"
path = "src/main.rs"

[dependencies]
qrs-formats.workspace = true
qrs-library.workspace = true
qrs-ui.workspace = true
eframe.workspace = true
image.workspace = true
rfd = { version = "0.15", default-features = false }

[build-dependencies]
winresource = "0.1.34"

[target.'cfg(target_os = "linux")'.dependencies]
# file dialogs through the desktop portal (GNOME, KDE)
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[target.'cfg(not(target_os = "android"))'.dependencies.eframe]
workspace = true
features = ["accesskit", "web_screen_reader"]

[target.'cfg(not(target_os = "android"))'.dependencies.winit]
version = "0.30"
