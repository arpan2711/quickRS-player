[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
qrs-formats = { path = "crates/qrs-formats" }
qrs-analysis = { path = "crates/qrs-analysis" }
qrs-audio = { path = "crates/qrs-audio" }
qrs-library = { path = "crates/qrs-library" }
qrs-ui = { path = "crates/qrs-ui" }
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
log = "0.4.34"
clap = { version = "4.6.7", features = ["derive"] }
aes = "0.9.3"
ctr = "0.10.1"
cfb-mode = "0.9.1"
flate2 = "1.1.10"
roxmltree = "0.21.1"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
serde_norway = "0.9.42"
lewton = "0.10.2"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "flac", "wav", "pcm", "vorbis", "ogg"] }
realfft = "3.5.0"
rubato = "5.0.1"
rtrb = "0.4.0"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
parking_lot = "0.12.5"
midir = "0.11.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
directories = "6.0.0"
eframe = "0.36.2"
egui = "0.36.2"
tiny-skia = "0.12.0"
raw-window-handle = "0.6.2"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
md-5 = "0.11.0"
windows = "0.62.2"
signalsmith-stretch = "0.1.3"
windows-core = "0.62.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("nux"))'] }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
chunks_exact_to_as_chunks = "allow"
needless_range_loop = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

# optimised like release but quick to rebuild (no LTO, incremental): for screenshot comparisons while working
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
